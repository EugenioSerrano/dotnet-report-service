manifestVersion: "1.0"
id: pilot-grouped
version: "1.0.0"
engine: scriban
engineVersion: "7.5.1"
dataContract:
  version: "1.0"
  profile: header-items-v1
  schema: schema.json
outputs:
  html:
    documentStart: html/document-start.html.sbn
    row: html/row.html.sbn
    groupStart: html/group-start.html.sbn
    groupEnd: html/group-end.html.sbn
    documentEnd: html/document-end.html.sbn
    styles: [html/styles.css]
  pdf:
    paper: A4
    orientation: portrait
    marginMm: { top: 15, right: 12, bottom: 18, left: 12 }
    chunkLayout: page-boundary
    pageNumbering: global
    pageTotals:
      enabled: true
      amountField: amount
      scale: 2
  xlsx:
    fallback: raw
    columns:
      - { path: sequence, type: integer }
      - { path: groupId, type: string }
      - { path: groupName, type: string }
      - { path: date, type: date }
      - { path: description, type: string }
      - { path: amount, type: decimal }
partitioning:
  groupKey: groupId
  preferredCut: group-boundary
localeDefaults:
  culture: es-AR
  timeZone: America/Argentina/Buenos_Aires
