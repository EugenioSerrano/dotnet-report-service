manifestVersion: "1.0"
id: __TEMPLATE_ID__
version: "__VERSION__"
owner: dev-consumer
shared: false
engine: __ENGINE__
engineVersion: "__ENGINE_VERSION__"
dataContract:
  version: "1.0"
  profile: header-items-v1
  schema: schema.json
outputs:
  html:
    parts:
      documentStart: html/document-start.html__PART_EXTENSION__
      row: html/row.html__PART_EXTENSION__
      documentEnd: html/document-end.html__PART_EXTENSION__
    styles: [html/styles.css]
  pdf:
    paper: A4
    orientation: portrait
    marginMm: { top: 15, right: 12, bottom: 18, left: 12 }
    chunkLayout: page-boundary
    pageNumbering: global
    pageTotals:
      enabled: false
    verification:
      anchors:
        header:
          - "$.reportTitle"
          - "$.customer.name"
          - "$.customer.id"
          - "$.currency"
          - "$.generatedAt"
          - "$.totals.recordCount"
          - "$.totals.amount"
        item:
          - "$.sequence"
          - "$.description"
          - "$.quantity"
          - "$.unitPrice"
          - "$.amount"
  xlsx:
    fallback: raw
    columns:
      - { path: sequence, type: integer }
      - { path: description, type: string }
      - { path: quantity, type: integer }
      - { path: unitPrice, type: decimal }
      - { path: amount, type: decimal }
