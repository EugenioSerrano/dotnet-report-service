manifestVersion: "1.0"
id: sample-gate
version: "1.2.0"
owner: billing-system
shared: false
engine: liquid
engineVersion: "2.40.0"
dataContract:
  version: "1.0"
  profile: header-items-v1
  schema: schema.json
outputs:
  html:
    parts:
      documentStart: html/document-start.html.liquid
      row: html/row.html.liquid
      documentEnd: html/document-end.html.liquid
    styles: [html/styles.css]
  pdf:
    paper: A4
    orientation: portrait
    marginMm: { top: 15, right: 12, bottom: 18, left: 12 }
    chunkLayout: page-boundary
    pageNumbering: global
    pageTotals:
      enabled: false
    verification:
      anchors:
        header: ["$.reportTitle", "$.customer.name", "$.currency", "$.totals.recordCount"]
        item: ["$.sequence", "$.description"]
localeDefaults:
  culture: es-AR
  timeZone: America/Argentina/Buenos_Aires